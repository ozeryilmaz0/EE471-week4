<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure Speech Services</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="card">
        <h1>🎤 Azure Speech Services</h1>
        <p class="subtitle">Text-to-Speech &amp; Speech-to-Text powered by Azure Cognitive Services</p>

        <nav class="tabs" role="tablist">
            <button class="tab active" data-tab="tts" role="tab" aria-selected="true">Text to Speech</button>
            <button class="tab" data-tab="stt" role="tab" aria-selected="false">Speech to Text</button>
        </nav>

        <!-- Text to Speech panel -->
        <section id="tts-panel" class="panel" role="tabpanel">
            <div class="field">
                <label for="text-input">Enter text to convert to speech:</label>
                <textarea id="text-input" rows="6" placeholder="Type something..."></textarea>
            </div>

            <div class="field">
                <label for="voice-select">Voice:</label>
                <select id="voice-select">
                    <option value="en-US-JennyNeural">en-US-JennyNeural</option>
                    <option value="en-US-GuyNeural">en-US-GuyNeural</option>
                    <option value="tr-TR-EmelNeural">tr-TR-EmelNeural</option>
                    <option value="tr-TR-AhmetNeural">tr-TR-AhmetNeural</option>
                </select>
            </div>

            <div class="buttons">
                <button id="synthesize-btn" class="btn btn-primary btn-wide">🔊 Synthesize Speech</button>
                <button id="tts-clear-btn" class="btn btn-secondary">Clear</button>
            </div>

            <div id="tts-message" class="message hidden"></div>

            <div id="audio-section" class="output-box audio-section hidden">
                <h2>Generated Audio:</h2>
                <audio id="audio-player" controls></audio>
                <a id="download-btn" class="btn btn-info" download="speech.wav">⬇ Download Audio</a>
            </div>
        </section>

        <!-- Speech to Text panel -->
        <section id="stt-panel" class="panel hidden" role="tabpanel">
            <div class="field">
                <label for="language-select">Language:</label>
                <select id="language-select">
                    <option value="en-US">English (en-US)</option>
                    <option value="tr-TR">Türkçe (tr-TR)</option>
                </select>
            </div>

            <div class="field">
                <label>Record or upload audio to convert to text:</label>
                <div class="input-row">
                    <button id="record-btn" class="btn btn-primary">🎙 Start Recording</button>
                    <button id="stop-btn" class="btn btn-danger" disabled>⏹ Stop Recording</button>
                    <input id="file-input" type="file" accept="audio/*">
                </div>

                <div id="recording-indicator" class="recording-indicator hidden">● Recording...</div>
                <p id="recording-status" class="status hidden"></p>
            </div>

            <div class="buttons">
                <button id="transcribe-btn" class="btn btn-primary btn-wide">📄 Transcribe Audio</button>
                <button id="stt-clear-btn" class="btn btn-secondary">Clear</button>
            </div>

            <div id="stt-message" class="message hidden"></div>

            <div id="result-section" class="output-box result-section hidden">
                <h2>Transcription:</h2>
                <p id="result-text" class="result-text"></p>
                <button id="copy-btn" class="btn btn-info">📋 Copy Text</button>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
